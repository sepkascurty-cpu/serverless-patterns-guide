<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5b6b7a"/>
    </marker>
    <style>
      .title { font-size:20px; font-weight:bold; fill:#1f2d3d; }
      .box { rx:8; stroke-width:1.5; }
      .label { font-size:13px; fill:#1f2d3d; font-weight:bold; }
      .sub { font-size:11px; fill:#5b6b7a; }
      .zone { font-size:12px; fill:#8a97a3; font-weight:bold; letter-spacing:2px; }
    </style>
  </defs>

  <rect width="960" height="600" fill="#f7f9fb"/>
  <text x="30" y="38" class="title">Serverless Event-Driven Architecture — Order Pipeline</text>

  <!-- Zone labels -->
  <text x="30" y="70" class="zone">INGEST</text>
  <text x="330" y="70" class="zone">ROUTE</text>
  <text x="590" y="70" class="zone">PROCESS</text>
  <text x="830" y="70" class="zone">STORE</text>

  <!-- Ingest column -->
  <rect x="30" y="90" width="200" height="70" class="box" fill="#e8f4fd" stroke="#4aa3df"/>
  <text x="130" y="115" text-anchor="middle" class="label">API Gateway</text>
  <text x="130" y="135" text-anchor="middle" class="sub">REST / HTTP orders</text>

  <rect x="30" y="180" width="200" height="70" class="box" fill="#e8f4fd" stroke="#4aa3df"/>
  <text x="130" y="205" text-anchor="middle" class="label">Amazon S3</text>
  <text x="130" y="225" text-anchor="middle" class="sub">CSV / file drops</text>

  <rect x="30" y="270" width="200" height="70" class="box" fill="#e8f4fd" stroke="#4aa3df"/>
  <text x="130" y="295" text-anchor="middle" class="label">Partner Webhook</text>
  <text x="130" y="315" text-anchor="middle" class="sub">EventBridge API dest.</text>

  <!-- Route column -->
  <rect x="330" y="150" width="170" height="140" class="box" fill="#efe6fb" stroke="#8b5fbf"/>
  <text x="415" y="180" text-anchor="middle" class="label">EventBridge Bus</text>
  <text x="415" y="200" text-anchor="middle" class="sub">rule: order.created</text>
  <text x="415" y="218" text-anchor="middle" class="sub">rule: order.paid</text>
  <text x="415" y="236" text-anchor="middle" class="sub">fan-out, no polling</text>
  <text x="415" y="262" text-anchor="middle" class="sub" font-style="italic">central nervous system</text>

  <!-- Arrows ingest -> bus -->
  <line x1="230" y1="125" x2="320" y2="180" stroke="#5b6b7a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="230" y1="215" x2="320" y2="215" stroke="#5b6b7a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="230" y1="305" x2="320" y2="255" stroke="#5b6b7a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Process column: SQS + Lambdas -->
  <rect x="590" y="90" width="170" height="60" class="box" fill="#fff4e0" stroke="#e0a83e"/>
  <text x="675" y="112" text-anchor="middle" class="label">SQS: payments</text>
  <text x="675" y="132" text-anchor="middle" class="sub">burst buffer</text>

  <rect x="590" y="165" width="170" height="70" class="box" fill="#ffe9d6" stroke="#e07b39"/>
  <text x="675" y="190" text-anchor="middle" class="label">λ charge-payment</text>
  <text x="675" y="210" text-anchor="middle" class="sub">idempotent handler</text>

  <rect x="590" y="255" width="170" height="60" class="box" fill="#fff4e0" stroke="#e0a83e"/>
  <text x="675" y="277" text-anchor="middle" class="label">SQS: fulfillment</text>
  <text x="675" y="297" text-anchor="middle" class="sub">burst buffer</text>

  <rect x="590" y="330" width="170" height="70" class="box" fill="#ffe9d6" stroke="#e07b39"/>
  <text x="675" y="355" text-anchor="middle" class="label">λ fulfill-order</text>
  <text x="675" y="375" text-anchor="middle" class="sub">Step Functions opt.</text>

  <!-- Arrows bus -> process -->
  <line x1="500" y1="200" x2="580" y2="120" stroke="#5b6b7a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="235" x2="580" y2="285" stroke="#5b6b7a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="675" y1="150" x2="675" y2="165" stroke="#5b6b7a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="675" y1="315" x2="675" y2="330" stroke="#5b6b7a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Store column -->
  <rect x="830" y="90" width="100" height="90" class="box" fill="#e2f5e9" stroke="#3fa46a"/>
  <text x="880" y="120" text-anchor="middle" class="label">DynamoDB</text>
  <text x="880" y="140" text-anchor="middle" class="sub">orders</text>
  <text x="880" y="156" text-anchor="middle" class="sub">idempotency</text>

  <rect x="830" y="200" width="100" height="70" class="box" fill="#e2f5e9" stroke="#3fa46a"/>
  <text x="880" y="228" text-anchor="middle" class="label">S3</text>
  <text x="880" y="248" text-anchor="middle" class="sub">archive</text>

  <!-- Arrows process -> store -->
  <line x1="760" y1="200" x2="820" y2="140" stroke="#5b6b7a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="760" y1="365" x2="820" y2="235" stroke="#5b6b7a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- DynamoDB Streams feedback -->
  <path d="M 880 180 C 880 320, 700 300, 690 165" fill="none" stroke="#8b5fbf" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="790" y="300" text-anchor="middle" class="sub" fill="#8b5fbf">DynamoDB Streams → read model</text>

  <!-- DLQs -->
  <rect x="590" y="430" width="170" height="60" class="box" fill="#fde8e8" stroke="#d64545"/>
  <text x="675" y="452" text-anchor="middle" class="label">DLQs</text>
  <text x="675" y="472" text-anchor="middle" class="sub">poison messages + alarm</text>
  <line x1="620" y1="150" x2="620" y2="430" stroke="#d64545" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <line x1="730" y1="315" x2="730" y2="430" stroke="#d64545" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- Observability -->
  <rect x="330" y="430" width="170" height="60" class="box" fill="#e6ecf2" stroke="#5b6b7a"/>
  <text x="415" y="452" text-anchor="middle" class="label">CloudWatch + X-Ray</text>
  <text x="415" y="472" text-anchor="middle" class="sub">metrics · traces · alarms</text>

  <text x="30" y="560" class="sub">At-least-once delivery everywhere → idempotency in every handler · partial batch responses → poison messages never block the queue</text>
</svg>
